<!DOCTYPE html>
<!--
  BGAD News Flash issue template.

  Replace every {{PLACEHOLDER}} and repeat the <article> block per entry.
  Save to public/issues/{{DATE_ISO}}.html

  Rules that matter:
    - Never embed images as base64 data URIs. Link crawlers such as Flipboard,
      LinkedIn and Slack fetch og:image over HTTP and silently ignore data URIs,
      which is why cards used to render with no image at all.
    - og:image must be an absolute https URL, 1200x630, already generated by
      tools/make_cover.py before this file is written.
    - {{OG_DESCRIPTION}} is what people actually read on the Flipboard card.
      Name three or four concrete stories and end with an invitation to open it.
      Do not just repeat the standing subtitle.
    - No em-dashes or en-dashes anywhere.
    - The "Subscribe to our updates" call to action sits between the last entry
      and the footer, and links to the BGAD Consulting LinkedIn page at
      https://www.linkedin.com/company/bgad/. It appears in every issue. Keep it.

  Placeholders:
    {{DATE_ISO}}        2026-08-14
    {{DATE_PRETTY}}     14 August 2026
    {{ENTRY_COUNT}}     15
    {{OG_DESCRIPTION}}  see rules above, aim for 150 to 200 characters
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGAD News Flash, {{DATE_PRETTY}}</title>
<link rel="canonical" href="https://bgad-newsflash-production.up.railway.app/issues/{{DATE_ISO}}.html">
<meta name="description" content="{{OG_DESCRIPTION}}">
<meta property="og:site_name" content="BGAD News Flash">
<meta property="og:type" content="article">
<meta property="og:url" content="https://bgad-newsflash-production.up.railway.app/issues/{{DATE_ISO}}.html">
<meta property="og:title" content="BGAD News Flash, {{DATE_PRETTY}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:image" content="https://bgad-newsflash-production.up.railway.app/assets/covers/{{DATE_ISO}}.png">
<meta property="og:image:secure_url" content="https://bgad-newsflash-production.up.railway.app/assets/covers/{{DATE_ISO}}.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="BGAD News Flash, daily briefing on digital, tech and AI, {{DATE_PRETTY}}">
<meta property="article:published_time" content="{{DATE_ISO}}T07:00:00+10:00">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BGAD News Flash, {{DATE_PRETTY}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">
<meta name="twitter:image" content="https://bgad-newsflash-production.up.railway.app/assets/covers/{{DATE_ISO}}.png">
<style>
  :root { --blue:#026EC9; --dark:#024E8F; --light:#3991D9; --body:#232323; --gray:#6B6B6B; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f4f6f8; color:var(--body);
         font-family:Helvetica,Arial,sans-serif; line-height:1.5; }
  .wrap { max-width:760px; margin:0 auto; background:#fff; padding:24px 28px 8px; }
  header.brand { display:flex; align-items:center; gap:10px; padding-bottom:8px; }
  header.brand img { width:38px; height:auto; }
  .bname { font-weight:bold; font-size:15px; color:var(--blue); }
  .tag { font-weight:bold; font-size:13px; color:var(--light); letter-spacing:.02em; }
  .rule { border:0; border-top:2px solid var(--blue); margin:0 0 18px; }
  .cover { width:100%; height:auto; display:block; border-radius:2px; }
  h1 { font-size:30px; color:var(--dark); margin:18px 0 2px; }
  .sub { font-style:italic; color:var(--gray); margin:0 0 2px; font-size:16px; }
  .date { margin:0 0 22px; font-size:15px; }
  article { margin:0 0 22px; }
  article h2 { font-size:18px; color:var(--blue); margin:0 0 6px; line-height:1.3; }
  article h2 a { color:inherit; text-decoration:none; }
  article h2 a:hover { text-decoration:underline; }
  article p { margin:0 0 6px; font-size:16px; }
  .src { font-style:italic; font-size:13.5px; color:var(--gray); }
  .src a { color:var(--gray); text-decoration:none; }
  .src a:hover { text-decoration:underline; }
  .cta { text-align:center; margin:4px 0 20px; }
  .cta a { display:inline-block; background:var(--blue); color:#fff; text-decoration:none;
           font-weight:bold; font-size:15px; padding:11px 26px; border-radius:4px; }
  .cta a:hover { background:var(--dark); }
  footer { border-top:1.5px solid var(--blue); margin-top:10px; padding:10px 0 20px;
           display:flex; justify-content:space-between; font-size:13px; }
  footer .site { font-weight:bold; color:var(--blue); text-decoration:none; }
  footer .cr { color:var(--gray); }
  @media (max-width:640px) { .wrap { padding:16px; } h1 { font-size:25px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <img src="/assets/bgad-logo.png" alt="BGAD Consulting">
    <span class="bname">BGAD Consulting</span>
    <span class="tag">STRATEGIES. DELIVERED.</span>
  </header>
  <hr class="rule">
  <a href="https://bgad-newsflash-production.up.railway.app/issues/{{DATE_ISO}}.html"><img class="cover" src="/assets/newsflash-banner.jpg" width="1600" height="884" alt="BGAD News Flash"></a>
  <h1>BGAD News Flash</h1>
  <p class="sub">Daily briefing: digital, tech and AI</p>
  <p class="date">{{DATE_PRETTY}}</p>

<!-- repeat one <article> per entry -->
<article>
  <h2><a href="{{EPISODE_URL}}">{{HEADLINE}}</a></h2>
  <p>{{BODY_2_TO_4_SENTENCES}}</p>
  <p class="src"><a href="{{EPISODE_URL}}">Source: {{PODCAST}}, {{DATE}}, {{EPISODE_TITLE}}</a></p>
</article>
<!-- end repeat -->

  <div class="cta">
    <a href="https://www.linkedin.com/company/bgad/">Subscribe to our updates</a>
  </div>

  <footer>
    <a class="site" href="https://bgadconsulting.com">bgadconsulting.com</a>
    <span class="cr">&copy; BGAD Consulting</span>
  </footer>
</div>
</body>
</html>
